const SPR={};let spritesLeft=0;
function loadSprites(cb){
  const keys=Object.keys(SPRITES);spritesLeft=keys.length;
  keys.forEach(k=>{
    const d=SPRITES[k],img=new Image();

        c.getContext('2d').drawImage(img,0,0,c.width,c.height);SPR[k]={c,w:d.w,h:d.h,ox:d.ox,oy:d.oy};
      }catch(e){}

  });
}

function armNova(){const g=game;if(!g||g.state!=='play'||S.rockets<1||g.weapon==='nova'||g.rocket)return;g.prevWeapon=g.weapon;g.weapon='nova';g.novaCharge=0.55;sfx('ui');}

function update(dt){
  const g=game;if(!g)return;
  if(shake>0)shake=Math.max(0,shake-dt*40);
  if(flashA>0)flashA=Math.max(0,flashA-dt*2.2);
  // particles always
  for(let i=g.parts.length-1;i>=0;i--){const p=g.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;if(p.life<=0)g.parts.splice(i,1);}
  for(let i=g.debris.length-1;i>=0;i--){const d=g.debris[i];d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=d.g*dt;d.rot+=d.vr*dt;d.life-=dt;if(d.life<=0||d.y>VH+60)g.debris.splice(i,1);}
  for(let i=g.pops.length-1;i>=0;i--){const p=g.pops[i];p.life-=dt;p.y-=30*dt;if(p.life<=0)g.pops.splice(i,1);}
  if(g.pushFx>0){g.pushFx-=dt;g.pushRing+=dt*1.6;}
  if(g.freezeT>0)g.freezeT-=dt;
  if(g.rapidT>0)g.rapidT-=dt;else if(g.rapidCD>0)g.rapidCD-=dt;
  if(g.novaText>0)g.novaText-=dt;
  if(g.novaT>0)g.novaT-=dt;
  if(g.hurtT>0)g.hurtT-=dt;
  if(g.state==='won'||g.state==='dead'){g.wonT+=dt;return;}
  if(g.state!=='play')return;
  g.t+=dt;g.phase=(g.phase+zv()*dt*3)%1;
  if(g.inv>0)g.inv-=dt;
  if(g.helpT>0)g.helpT-=dt;
  // world 3 drift
  if(g.world===2){g.driftT-=dt;if(g.driftT<=0){g.driftT=rnd(4,7);g.drift=(Math.random()<0.5?-1:1)*0.32;}}else g.drift=0;
  // steering
  const tx=clamp(steerTarget,-0.86,0.86);
  const diffx=tx-g.px;const maxv=4.2;
  const want=clamp(diffx*14,-maxv,maxv);
  g.vx=lerp(g.vx,want,Math.min(1,dt*18));
  g.px=clamp(g.px+(g.vx+g.drift*0.5)*dt,-0.86,0.86);
  // weapon fire
  const wp=g.weapon;
  g.laserOn=false;
  if(wp==='nova'){
    g.novaCharge-=dt;
    if(g.novaCharge<=0){S.rockets=Math.max(0,S.rockets-1);g.rocket={x:g.px,z:0.03};sfx('push');g.weapon=(g.prevWeapon==='lance'&&S.laser<=0)?'pulse':g.prevWeapon;saveSoon();}
  }else if(wp==='pulse'){
    g.fireT-=dt;
    const rate=(0.12-0.003*(S.pw.p-1))*(g.rapidT>0?0.5:1);
    while(g.fireT<=0){
      g.fireT+=rate;g.fireSide^=1;
      const off=(g.fireSide?1:-1)*(70*SHIP_SCALE)/HW;
      g.bul.push({x:g.px+off,z:0.02,vz:2.6,d:(1.2+0.6*(S.pw.p-1))*(g.rapidT>0?1.25:1)});sfx('shoot');
    }
  }else if(wp==='lance'){
    if(S.laser<=0){g.weapon='pulse';showToast('Laser is empty.');}
    else{
      g.laserOn=true;S.laser=Math.max(0,S.laser-dt*(11-S.pw.l*0.5));
      const bw=0.07+0.012*S.pw.l,dps=16+5*S.pw.l;
      g.ents.forEach(e=>{if(e.dead||e.coin||e.z<0||(e.type==='ally'&&e.z>0.6))return;if(Math.abs(e.x-g.px)<e.hw+bw){damageEnt(e,dps*dt);}});
      if(g.boss&&!g.boss.dead&&Math.abs(g.boss.x-g.px)<g.boss.hw+bw)damageBoss(dps*dt*0.9);
      sfx('laser');
    }
  }
  // bullets
  for(let i=g.bul.length-1;i>=0;i--){
    const b=g.bul[i];b.z+=b.vz*dt;
    // light aim assist: bullets lean toward the nearest enemy ahead
    let tgt=null;
    for(const e of g.ents){if(e.dead||e.coin||e.type==='ally'||e.z<b.z-0.02||e.z>b.z+0.7)continue;if(Math.abs(e.x-b.x)<e.hw+0.12&&(!tgt||e.z<tgt.z))tgt=e;}
    if(tgt)b.x+=clamp(tgt.x-b.x,-1.1*dt,1.1*dt);
    let hit=false;
    for(const e of g.ents){
      if(e.dead||e.coin||(e.type==='ally'&&e.z>0.6))continue;
      if(Math.abs(b.x-e.x)<e.hw+0.03&&Math.abs(b.z-e.z)<0.07){damageEnt(e,b.d);hit=true;break;}
    }
    if(!hit&&g.boss&&!g.boss.dead&&Math.abs(b.x-g.boss.x)<g.boss.hw&&Math.abs(b.z-g.boss.z)<0.08){damageBoss(b.d);hit=true;const p=proj(b.z);addParts(px(b.x,p.s),p.y,3,'#fff',120,0.3,2);}
    if(hit||b.z>1.05)g.bul.splice(i,1);
  }
  // nova rocket flies straight up the lane, then blasts
  if(g.rocket){
    const r=g.rocket;r.z+=2.2*dt;
    addParts(px(r.x,proj(r.z).s),proj(r.z).y,2,COL.gd,60,0.35,3);
    let boom=r.z>=0.78;
    if(!boom)for(const e of g.ents){if(e.dead||e.coin||e.type==='ally')continue;if(Math.abs(e.x-r.x)<e.hw+0.05&&Math.abs(e.z-r.z)<0.06){boom=true;break;}}
    if(!boom&&g.boss&&!g.boss.dead&&Math.abs(g.boss.x-r.x)<g.boss.hw&&r.z>=g.boss.z-0.04)boom=true;
    if(boom){g.rocket=null;fireNova();}
  }
  // entities
  const v=zv()*(g.freezeT>0?0:1);
  for(let i=g.ents.length-1;i>=0;i--){
    const e=g.ents[i];
    if(e.dead){g.ents.splice(i,1);continue;}
    if(e.flash>0)e.flash-=dt;
    e.z-=v*e.vz*dt*(e.type==='drone'?1.05:1);
    e.ph+=dt*3;
    if(g.freezeT<=0){
      if(e.type==='drone'&&e.sweep){e.x+=e.sweep*dt;if(Math.abs(e.x)>0.84){e.x=clamp(e.x,-0.84,0.84);e.sweep=-e.sweep;}}
      else if(e.type==='drone'){
        if(e.z<0.55)e.x+=clamp(g.px-e.x,-1,1)*0.3*dt*diff();
        if(g.L>=3){
          if(e.dodgeCD>0)e.dodgeCD-=dt;
          if(e.dodgeT>0){e.dodgeT-=dt;e.x=clamp(e.x+e.dv*dt,-0.84,0.84);}
          else if(!(e.dodgeCD>0)&&e.z<0.8&&e.z>0.15){
            for(const b of g.bul){if(b.z<e.z&&e.z-b.z<0.25&&Math.abs(b.x-e.x)<e.hw+0.05){e.dv=(e.x>=0?-1:1)*1.5;e.dodgeT=0.3;e.dodgeCD=1.3;break;}}
          }
        }
      }
      if(e.type==='ally'){e.x=clamp(e.x+Math.sin(e.ph*0.5)*0.12*dt,-0.85,0.85);}
      if(e.type==='weaver'){e.x=clamp(e.x+Math.cos(e.ph)*0.9*dt,-0.85,0.85);}
    }
    if(e.coin){ // coin pickup
      if(e.z<0.04&&Math.abs(e.x-g.px)<0.22){earn(3);g.score+=5;e.dead=true;sfx('coin');const p=proj(0);pop('+3',px(e.x,1),SHIP_BOTTOM-160,COL.gd,14);}
      else if(e.z<-0.1)e.dead=true;
      continue;
    }
    if(e.z<0.035&&e.z>-0.06&&Math.abs(e.x-g.px)<e.hw*0.85+0.1){
      if(e.type==='ally'){allyPenalty(e);continue;}
      if(g.inv<=0){hurt(TYPES[e.type].dmg);}
      killEnt(e,true);continue;
    }
    if(e.z<-0.02&&!e.passed){
      e.passed=true;
      if(e.type==='ally'){g.saved++;earn(20);pop('SAVED +20',px(e.x,1),SHIP_BOTTOM-170,COL.bl,16);sfx('coin');}
      else if(Math.abs(e.x-g.px)<e.hw+0.3){g.streak+=2;g.score+=25*mult();pop('NEAR MISS',px(g.px,1),SHIP_BOTTOM-190,COL.gd,14);sfx('coin');}
    }
    if(e.z<-0.12)e.dead=true;
  }
  // spawns
  const dur=g.duration;
  if(g.t<dur){
    if(g.freezeT<=0)g.spawnT-=dt;
    if(g.spawnT<=0){spawnWave();g.spawnT=Math.max(0.5,rg(0.8,1.2)/diff()-g.t*0.002);}
    if(g.L>=2&&g.freezeT<=0){g.flankT-=dt;if(g.flankT<=0){g.flankT=rg(6,9)/Math.min(1.6,diff());spawnEnt('drone',-0.82,1.02,{sweep:0.55});spawnEnt('drone',0.82,1.02+0.05,{sweep:-0.55});}}
    // friendly blue ships
    if(g.allyPlan){if(g.allyPlan.length&&g.t>=g.allyPlan[0]){if(spawnAlly())g.allyPlan.shift();else g.allyPlan[0]+=1;}}
    else{g.allyT-=dt;if(g.allyT<=0){g.allyT=rg(12,18);if(g.ents.filter(e=>e.type==='ally'&&!e.dead).length<2)spawnAlly();}}
    if(!g.squad&&g.t>g.duration*0.4){g.squad=true;[-0.7,0,0.7].forEach((x,i)=>spawnEnt('goblin',x,1.02+i*0.09));pop('GOBLIN SQUAD',VX,330,'#9dff7a',22);sfx('chime');}
    if(!g.titanEv&&g.t>g.duration*0.72){g.titanEv=true;spawnEnt('titan',R()<0.5?-0.45:0.45,1.02);pop('TITAN',VX,330,'#9dff7a',24);sfx('chime');}
    g.coinT-=dt;
    if(g.coinT<=0){
      g.coinT=rg(5,8);const cx=rg(-0.6,0.6);
      for(let i=0;i<5;i++){const e=spawnEnt('bomb',cx+Math.sin(i*0.9)*0.2,1.02+i*0.035,{coin:true,hw:0.12,hp:1});}
    }
  }else if(!g.bossSpawned){
    g.bossSpawned=true;spawnBoss();
  }
  if(g.boss)updateBoss(dt);
}
function bossKind(){const L=game.L;return(L%5===0)?'final':'mini';}
function spawnBoss(){
  const g=game,L=g.L,final=bossKind()==='final';
  const stars=final?([1,3,5][Math.floor((L-1)/5)]):0;
  const hp=(140+40*L)*(final?2.2*(1+0.25*(stars-1)):1);
  g.boss={x:0,z:1.0,hw:final?1.4:1.1,hp,maxhp:hp,final,stars,flash:0,t:0,atk:2,atk2:5,dead:false,pushed:0,
          name:final?['THE ANNIHILATOR','THE ANNIHILATOR','THE ANNIHILATOR'][Math.floor((L-1)/5)]:['SKYBREAKER','WARDEN','STORMCALLER'][g.world]};
  g.ents.forEach(e=>{if(!e.coin)e.vz=1;});
  showToast(g.boss.name+' INCOMING');

function updateBoss(dt){
  const g=game,b=g.boss;
  if(b.dead){
    b.dieT+=dt;const P=bossPos(b),fin=b.final,end=fin?5.2:2.4;
    b.boom=(b.boom||0)-dt;
    if(b.boom<=0&&b.dieT<(fin?3.9:1.8)){
      b.boom=fin?rnd(0.12,0.22):rnd(0.15,0.3);b.n=(b.n||0)+1;
      const bx=P.x+rnd(-110,110)*P.sc,by=P.y+rnd(-70,60)*P.sc;
      addParts(bx,by,16,[COL.mg,COL.gd,'#fff'][b.n%3],320,0.9,4);bossBreak(b,1,true);shake=Math.max(shake,fin?14:9);sfx('boom');
      if(b.n%3===0){flashA=0.45;flashC=[COL.mg,COL.gd,'#fff',COL.cy][(b.n/3)%4|0];}
    }
    if(fin){
      b.fw=(b.fw||0)-dt;
      if(b.fw<=0&&b.dieT>0.8&&b.dieT<4.6){b.fw=rnd(0.25,0.45);firework(rnd(40,VW-40),rnd(140,420),[COL.mg,COL.gd,COL.cy,'#fff'][Math.floor(Math.random()*4)],28);sfx('coin');}
      if(b.dieT>=3.2&&!b.landed){b.landed=true;shake=34;flashA=0.8;flashC='#fff';sfx('nova');addParts(P.x,P.y+60,60,'#ffd27a',360,1.2,5);bossBreak(b,6,true);}
      if(b.dieT>=3.7&&!b.fin){b.fin=true;shake=40;flashA=1;flashC='#fff';sfx('nova');pop('TARGET DESTROYED',VX,330,COL.gd,26);for(let i=0;i<6;i++)firework(rnd(40,VW-40),rnd(160,460),[COL.mg,COL.gd,COL.cy][i%3],34);addParts(P.x,P.y,90,COL.gd,420,1.5,5);}
    }
    if(b.dieT>end&&g.state==='play')endRun(true);return;}
  if(g.freezeT>0){if(b.flash>0)b.flash-=dt;return;}
  b.smk=(b.smk||0)-dt;
  if(b.smk<=0&&b.holes&&b.holes.length){b.smk=0.07;const P=bossPos(b),h=b.holes[Math.floor(Math.random()*b.holes.length)];g.parts.push({x:P.x+h.ox*P.sc,y:P.y+h.oy*P.sc,vx:rnd(-14,14),vy:rnd(-90,-40),life:0.9,max:0.9,col:Math.random()<0.5?'#ff9d2b':'#7a5a8a',size:3.6,g:-30});}
  b.t+=dt;if(b.flash>0)b.flash-=dt;if(b.pushed>0)b.pushed-=dt;
  const tz=0.56;
  if(b.z>tz)b.z=Math.max(tz,b.z-0.16*dt);
  b.x=Math.sin(b.t*(b.final?0.7:0.9))*(b.final?0.28:0.5);
  if(b.z<=tz+0.01){
    b.atk-=dt;
    if(b.atk<=0){
      b.atk=(b.final?1.5:2.1)/Math.min(1.5,diff());
      const e=spawnEnt('bomb',b.x+rg(-0.5,0.5),0.6,{vz:1.0});e.hw=0.2;
    }
    b.atk2-=dt;
    if(b.atk2<=0){
      b.atk2=b.final?4.6:6.5;
      const gap=rg(-0.55,0.55);
      [-0.78,-0.2,0.38].forEach(x=>{if(Math.abs(x+0.1-gap)>0.42)spawnEnt('barrier',x,0.6,{hw:0.3});});
      if(b.final)spawnEnt('drone',b.x,0.6);
    }
  }
}

/* ---------- drawing helpers ---------- */
const FT="'Orbitron','Arial Black','Segoe UI',Impact,sans-serif";
const FU="'Rajdhani','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif";
function T(s,x,y,size,col,al,wt,ls,glow,font){
  ctx.font=(wt||700)+' '+size+'px '+(font||FU);ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';
  if('letterSpacing' in ctx)ctx.letterSpacing=(ls||0)+'px';
  ctx.fillStyle=col;if(glow){ctx.shadowColor=glow;ctx.shadowBlur=14;}
  ctx.fillText(s,x,y);ctx.shadowBlur=0;if('letterSpacing' in ctx)ctx.letterSpacing='0px';
}
function TT(s,x,y,size,col,al,ls,glow){T(s,x,y,size,col,al,800,ls,glow,FT);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function diamond(x,y,h,col){const w=h*0.78;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y);ctx.lineTo(x,y+h/2);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.fill();}
function coinPill(x,y){
  rr(x,y,134,44,22);ctx.fillStyle='rgba(5,4,15,0.7)';ctx.fill();ctx.strokeStyle='rgba(255,207,51,0.55)';ctx.lineWidth=1.5;ctx.stroke();
  diamond(x+22,y+22,18,COL.gd);T(fmt(S.coins),x+38,y+28,15,COL.gd,'left',700,0.5,null,FT);
  ctx.beginPath();ctx.arc(x+134-20,y+22,11,0,6.283);ctx.fillStyle='rgba(255,207,51,0.16)';ctx.fill();ctx.strokeStyle=COL.gd;ctx.lineWidth=1.8;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+134-26,y+22);ctx.lineTo(x+134-14,y+22);ctx.moveTo(x+134-20,y+16);ctx.lineTo(x+134-20,y+28);ctx.stroke();
  if(screen!=='shop')hit(x,y,134,44,()=>{if(screen==='play'&&game&&game.state!=='play'&&game.state!=='won'&&game.state!=='dead')return;openCoins();});
}

function btn(x,y,w,h,label,o,cb){

function drawTunnel(world,phase,t){

  ctx.fillStyle=g;ctx.fillRect(0,0,VW,HY);bgStars();

  ctx.fillStyle=th.floor;ctx.fillRect(0,HY,VW,VH-HY);

  const N=10;
  for(let k=0;k<N;k++){

  }

  ctx.globalAlpha=0.55;
  [-3.4,-2.2,-1.1,1.1,2.2,3.4].forEach(l=>{ctx.beginPath();ctx.moveTo(VX,HY);ctx.lineTo(VX+l*HW*bot,VH);ctx.stroke();});
  ctx.globalAlpha=1;
  ctx.setLineDash([10,8]);ctx.strokeStyle=th.edge;ctx.globalAlpha=0.35;
  [-0.5,0.5].forEach(l=>{ctx.beginPath();ctx.moveTo(VX,HY);ctx.lineTo(VX+l*HW*bot,VH);ctx.stroke();});
  ctx.setLineDash([]);ctx.globalAlpha=1;

      ctx.stroke();
    }

  }

    ctx.strokeStyle='#e8fbff';ctx.lineWidth=3;ctx.globalAlpha=0.7;
    for(let i=0;i<4;i++){
      const z=((i*0.25+0.15-(t*0.05))%1+1)%1,p=proj(z);

  }

  ctx.beginPath();ctx.moveTo(VX,HY);ctx.lineTo(VX-HW*bot,VH);ctx.moveTo(VX,HY);ctx.lineTo(VX+HW*bot,VH);ctx.stroke();ctx.shadowBlur=0;
}

/* ---------- input ---------- */
function toLogical(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(cv.width/Math.max(1,r.width)),cy=(e.clientY-r.top)*(cv.height/Math.max(1,r.height));
  return {x:(cx-OX)/SC,y:(cy-OY)/SC};
}
function uiHit(p){
  for(let i=uiList.length-1;i>=0;i--){const u=uiList[i];if(p.x>=u.x&&p.x<=u.x+u.w&&p.y>=u.y&&p.y<=u.y+u.h)return u;}
  return null;
}
function onDown(e){
  e.preventDefault();initAudio();inTouch=e.pointerType!=='mouse';
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=toLogical(e);pointers.set(e.pointerId,p);
  const u=uiHit(p);
  if(u){
    const now=performance.now();
    if(now-lastUi<160)return;     // spam click guard
    lastUi=now;
    try{u.cb();}catch(err){}
    return;
  }
  if(screen==='play'&&game&&game.state==='play'&&!modal&&!busy){
    const nt=performance.now();
    if(nt-lastTap<550){
      if(game.rapidT<=0&&game.rapidCD<=0){game.rapidT=3;game.rapidCD=8;sfx('push');flashA=0.25;flashC=COL.gd;pop('RAPID FIRE',VX,380,COL.gd,22);lastTap=0;}
      else if(game.rapidT<=0){pop('RAPID IN '+Math.ceil(game.rapidCD),VX,380,COL.dim,16);lastTap=0;}
    }else lastTap=nt;
    if(steerId===null||!pointers.has(steerId)){steerId=e.pointerId;}
    if(steerId===e.pointerId)steerTarget=(p.x-VX)/HW;
  }
}
function onMove(e){
  e.preventDefault();
  if(e.pointerType==='mouse'){inTouch=false;if(screen==='play'&&game&&game.state==='play'&&!modal&&!busy)steerTarget=(toLogical(e).x-VX)/HW;}
  if(!pointers.has(e.pointerId))return;
  const p=toLogical(e);pointers.set(e.pointerId,p);
  if(e.pointerId===steerId&&screen==='play'&&game&&game.state==='play')steerTarget=(p.x-VX)/HW;
}
function onUp(e){
  e.preventDefault();pointers.delete(e.pointerId);
  if(e.pointerId===steerId)steerId=null;
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
}
function clearInput(){pointers.clear();steerId=null;}
['pointerup','touchend','click','keydown'].forEach(n=>window.addEventListener(n,()=>{initAudio();},{passive:true,capture:true}));
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onUp,{passive:false});
cv.addEventListener('lostpointercapture',e=>{pointers.delete(e.pointerId);if(e.pointerId===steerId)steerId=null;});
['contextmenu','selectstart','dragstart','gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ---------- resize + loop ---------- */
function resize(){
  const vw=Math.max(1,window.innerWidth),vh=Math.max(1,window.innerHeight);
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=Math.round(vw*DPR);cv.height=Math.round(vh*DPR);
  SC=Math.min(cv.width/VW,cv.height/VH);OX=(cv.width-VW*SC)/2;OY=(cv.height-VH*SC)/2;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);

let lastTime=0,acc=0,firstFrame=false,readySent=false,loaded=false;
const STEP=1/60;
function frame(ts){
  requestAnimationFrame(frame);
  try{
    if(!lastTime)lastTime=ts;
    let dt=(ts-lastTime)/1000;lastTime=ts;
    if(!(dt>0)||dt>0.25)dt=STEP;
    tNow=ts/1000;
    acc+=dt;let steps=0;
    while(acc>=STEP&&steps<5){
      acc-=STEP;steps++;
      menuPhase=(menuPhase+0.004)%1;
      if(game&&screen==='play'){
        if(game.state==='paused'||game.state==='pausedinfo'||modal||busy){}
        else update(STEP);
      }
      if(toast.life>0)toast.life-=STEP;
    }
    if(acc>STEP*5)acc=0;
    musicTick();
    draw();
    if(!firstFrame){firstFrame=true;try{if(YT&&YT.game&&YT.game.firstFrameReady)YT.game.firstFrameReady();}catch(e){}}
    if(loaded&&!readySent){readySent=true;try{if(YT&&YT.game&&YT.game.gameReady)YT.game.gameReady();}catch(e){}}
  }catch(err){try{console.error(err);}catch(_){} }
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#05040f';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SC,0,0,SC,OX,OY);
  ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
  uiList.length=0;
  if(screen==='load')drawLoad();
  else if(screen==='menu'){drawMenu();}
  else if(screen==='garage')drawGarage();
  else if(screen==='shop')drawShop();
  else if(screen==='play'){drawPlay();}
  if(modal&&modal.custom&&(screen!=='play'||!game||game.state!=='paused'))modal=null;
  if(modal&&!modal.custom&&modal.screen!==screen){if(modal.close)modal.close();modal=null;}
  if(modal){if(modal.custom)drawPauseModal();else drawModal();}
  drawToast();
  if(busy)drawBusy();
  ctx.restore();
}

/* ---------- boot ---------- */
function bootAudioState(){audioOn=sysAudio();try{if(YT&&YT.system&&YT.system.onAudioEnabledChange)YT.system.onAudioEnabledChange(on=>{audioOn=!!on;applyAudio();});}catch(e){}
  try{if(YT&&YT.system&&YT.system.onPause)YT.system.onPause(()=>{clearInput();if(game&&game.state==='play')pauseGame();saveNow();if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}});}catch(e){}
  try{if(YT&&YT.system&&YT.system.onResume)YT.system.onResume(()=>{lastTime=0;if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}});}catch(e){}
}
